name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: make build

      # Package builds nicely
      - name: Package Linux
        run: |
          mkdir release
          mv bin/bee release/bee
          zip -j bee.zip release/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bee-${{ matrix.os }}
          path: "*.zip"

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Show files
        run: ls -R

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.zip
